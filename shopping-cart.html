<!doctype html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrinho de compras</title>
    <link rel = "stylesheet" type = "text/css" href = "style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <span>Shopping Cart</span>
    </header>
    <main>
        <div class="page-title"> Pedido #1 </div>
        <div class="content">
            <section>
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantidade</th>
                            <th>Total cost</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <div class="product">
                                        <img src="Images/teclado.jpg" alt="custom Keyboard"
                                        height="100"
                                        width="100">
                                    <div class="info">
                                     <div class="name"> Custom Keyboard</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                $650,00
                            </td>
                            <td>
                                <div class="quantity">
                                    <button>
                                        <i class="bx bx-minus"></i>
                                    </button>
                                    <span>2</span>
                                    <button>
                                        <i class="bx bx-plus"></i>
                                    </button>
                                </div>
                            </td>
                            <td>
                                $1300,00
                            </td>
                            <td>
                                <button>
                                    <i class="bx bx-x"></i>
                                </button>
                            </td>
                        </tr><tbody>
                        <tr>
                            <td>
                                <div class="product">
                                        <img src="Images/headset.jpg" alt="headset"
                                        height="100"
                                        width="100">
                                    <div class="info">
                                     <div class="name"> Headset</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                $250,00
                            </td>
                            <td>
                                <div class="quantity">
                                    <button>
                                        <i class="bx bx-minus"></i>
                                    </button>
                                    <span>1</span>
                                    <button>
                                        <i class="bx bx-plus"></i>
                                    </button>
                                </div>
                            </td>
                            <td>
                                $250,00
                            </td>
                            <td>
                                <button>
                                    <i class="bx bx-x"></i>
                                </button>
                            </td>
                        </tr><tbody>
                        <tr>
                            <td>
                                <div class="product">
                                        <img src="Images/cadeira-gamer.jpg" alt="chair gamer"
                                        height="100"
                                        width="100">
                                    <div class="info">
                                     <div class="name"> Chair Gamer</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                $500,00
                            </td>
                            <td>
                                <div class="quantity">
                                    <button>
                                        <i class="bx bx-minus"></i>
                                    </button>
                                    <span>1</span>
                                    <button>
                                        <i class="bx bx-plus"></i>
                                    </button>
                                </div>
                            </td>
                            <td>
                                $500,00
                            </td>
                            <td>
                                <button>
                                    <i class="bx bx-x"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
            <aside>
                <div class="box">
                    <header>Market</header>
                    <div class="details">
                        <div>
                            <span>Sub Total</span>
                            <span>$0,00</span>
                        </div>
                        <div>
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>
                        <div>
                            <button>
                                 cupom of discount
                                <i class="bx bx-shopping-bag"></i>
                            </button>
                        </div>
                    </div>
                    <footer>
                        <span>Total</span>
                        <span>$0,00</span>
                    </footer>
                    <button>Finished market </button>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
